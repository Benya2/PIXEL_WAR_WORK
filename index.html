<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel War</title>
<link rel="stylesheet" href="style.css?v=recentpixels3">
</head>
<body>
<button id="authButton" type="button">Log In / Register</button>
<div id="authPanel" class="floating-panel auth-panel">
  <div class="panel-title">
    <strong id="authPanelTitle">Account</strong>
    <button id="authCloseBtn" type="button">×</button>
  </div>
  <div id="authTabs" class="auth-tabs">
    <button id="showLoginBtn" class="active" type="button">Login</button>
    <button id="showRegisterBtn" type="button">Register</button>
  </div>
  <form id="loginForm" class="auth-form">
    <label>Email <input id="loginEmail" type="email" autocomplete="email" required></label>
    <label>Password <input id="loginPassword" type="password" autocomplete="current-password" required></label>
    <button type="submit">Login</button>
  </form>
  <form id="registerForm" class="auth-form">
    <label>Nick <input id="registerNick" type="text" maxlength="24" autocomplete="nickname" required></label>
    <label>Email <input id="registerEmail" type="email" autocomplete="email" required></label>
    <label>Password <input id="registerPassword" type="password" minlength="6" autocomplete="new-password" required></label>
    <label>Code <input id="registerCode" type="text" autocomplete="one-time-code" required></label>
    <button type="submit">Create account</button>
  </form>
  <form id="profileForm" class="auth-form">
    <label>Nick <input id="profileNick" type="text" maxlength="24" autocomplete="nickname" required></label>
    <label>Email <input id="profileEmail" type="email" autocomplete="email" required></label>
    <label>Current password <input id="profilePassword" type="password" autocomplete="current-password" placeholder="Only for email change"></label>
    <button type="submit">Save profile</button>
  </form>
  <button id="logoutButton" type="button">Log out</button>
  <div id="authMessage" role="status"></div>
</div>
<h1>Pixel War</h1>
    
    <div id="coordsDisplay" style="
  position: fixed;
  left: 10px;
  bottom: 10px;
  background: rgba(255,255,255,0.9);
  border: 1px solid #000;
  padding: 4px 8px;
  font-family: monospace;
  z-index: 1000;
">X: 0  Y: 0</div>

    
    <div id="mobileControls" style="
  position: fixed; 
  bottom: 20px; 
  right: 150px; 
  display: flex; 
  flex-direction: column; 
  gap: 5px; 
  z-index: 10000;
">
  <button id="upBtn">↑</button>
  <div style="display:flex; gap:5px;">
    <button id="leftBtn">←</button>
    <button id="downBtn">↓</button>
    <button id="rightBtn">→</button>
  </div>
  <div style="display:flex; gap:5px; margin-top:5px;">
    <button id="zoomInBtn">+</button>
    <button id="zoomOutBtn">-</button>
  </div>
</div>


<div id="onlinePlayers" style="position:fixed; top:10px; right:10px; background:#fff; padding:5px; border:1px solid #000;"></div>
<div id="placementStatsCorner">
  <div id="myPlacementCount">Pixels: 0 today / 0 total</div>
  <button id="statsButton" type="button">Stats</button>
</div>
<div id="statsPanel" class="floating-panel">
  <div class="panel-title">
    <strong>Statistics</strong>
    <button id="statsCloseBtn" type="button">×</button>
  </div>
  <div id="statsContent">Loading...</div>
</div>
<div id="colorsChoice"></div>
<div id="togglePalette">🎨</div>
<div id="chat">💬</div>
<button id="pencilToggle" type="button" title="Pencil (Shift)" aria-label="Pencil" aria-pressed="false">&#9998;</button>
<button id="recentPixelsToggle" type="button" title="Recent pixels" aria-label="Recent pixels" aria-pressed="false">◎</button>
<canvas id="game"></canvas>
<div id="templateViewport">
  <img id="overlayTemplate" style="
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0.5;
  pointer-events: none;
  z-index: 9999;
  display: none;
">
</div>

<div id="cursor"></div>
<div id="reloadTimer"></div>
<div id="adminPanel" style="display:none">
    <h3>Админка</h3>
    <button id="banUser">Забанить пользователя</button>
    <div class="admin-row">
      <button id="adminPixelInfoBtn" type="button">Inspect pixel</button>
      <button id="adminActivityBtn" type="button">Drawing activity</button>
    </div>
    <div class="admin-row">
      <input type="text" id="banUserInput" placeholder="UID or email">
      <input type="text" id="banReasonInput" placeholder="Reason">
      <button id="unbanUserBtn" type="button">Unban</button>
    </div>
    <input type="text" id="coordsInput" placeholder="X Y [W H], X Y [W H]..." style="width:250px;">
    <input type="color" id="adminFillColor" value="#000000" title="Fill color">
    <button id="addPixelBtn">Fill color</button>
    <button id="removePixelBtn">Удалить</button>
    <input type="file" id="adminFillImage" accept="image/*">
    <button id="adminFillImageBtn" type="button">Fill image</button>
    <input type="text" id="teleportInput" placeholder="X Y" style="width:150px;">
    <button id="teleportBtn">Телепорт</button>
</div>

    


<button id="templatePanelToggle" type="button" title="Template" aria-label="Template" aria-expanded="false">🗺</button>
<div id="pixelInfoPanel" class="floating-panel"></div>
<div id="activityPanel" class="floating-panel">
  <div class="panel-title">
    <strong>Drawing activity</strong>
    <button id="activityCloseBtn" type="button">×</button>
  </div>
  <div id="activityContent">No activity yet.</div>
</div>
<div id="templateControls" class="template-panel">
  <div class="template-row">
    <input type="file" id="templateFile" accept="image/*">
  </div>
  <div class="template-row template-grid">
    <label>X <input type="number" id="coordX" value="0"></label>
    <label>Y <input type="number" id="coordY" value="0"></label>
  </div>
  <div class="template-row">
    <label>Opacity <input type="range" id="opacityRange" min="0" max="1" step="0.05" value="0.5"></label>
  </div>
  <div class="template-actions">
    <button id="applyCoords" type="button">OK</button>
    <button id="toggleBtn" class="template-loaded-control" type="button">Hide</button>
    <button id="clearTemplate" class="template-loaded-control" type="button">Clear</button>
    <button id="followTemplateBtn" class="template-loaded-control" type="button" title="Follow mouse">Move</button>
    <button id="autoTemplateColorBtn" class="template-loaded-control" type="button" title="Use template color">Auto</button>
    <button id="saveTemplateBtn" class="template-loaded-control" type="button">Save</button>
  </div>
  <div id="savedTemplatesBlock" class="saved-templates">
    <div class="saved-templates-title">Saved templates</div>
    <div id="savedTemplatesList"></div>
  </div>
</div>


    

    <div id="cooldownBox" style="
  position: fixed;
  top: 20px;
  right: 20px;
  background: rgba(0,0,0,0.7);
  color: white;
  padding: 8px 12px;
  border-radius: 8px;
  font-family: Arial, sans-serif;
  font-size: 16px;
  z-index: 10000;
  display: none;
">
  ⏳ <span id="cooldownTimer">1:00</span>
</div>


<script type="module" src="notast.js?v=recentpixels3"></script>
</body>
</html>
